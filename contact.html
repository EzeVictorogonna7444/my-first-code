<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body{
        background-color:  rgb(226, 239, 245);
    }
    div{
        margin: auto;
        width: 50%;
    }
    h1{
        margin-left: 50px;
        font-size: 60px;
    }
    p{
        font-size: 30px;
    }
    form{
        background-color: rgb(193, 230, 245);
        width: 80%;
        padding: 20px;
        border-radius: 10px;
    }
    label{
        font-size: 30px;
    }
    input{
        border: 2px red solid;
        width: 100%;
        height: 40px;
        border-radius: 10px;
    }
    button{
        margin-left: 20%;
        border-radius: 10px;
        padding: 10px;
        font-size: 20px;
        background: green;

    }
</style>
<body>
    <div>
  <h1>Contact Me</h1>  
  <p>You can message or call me in instagram,<br> facebook,whatsapp or twitter via 07076427444.</p>
<form action="" method="get">
    <label for="name">Name</label>
    <input type="text" id="name" placeholder="full name"><br><br>
    <label for="email">Email</label>
    <input type="email" id="email" placeholder="email"><br> <br>
    <label for="message">Message</label>
    <input type="text" id="message" placeholder="message"><br><br>
    <button type="submit">Submit</button>
    <button type="reset">Reset</button>
</form>
</div>
</body>
</html>
